backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "es"

collections:
  - name: "sitio"
    label: "Sitio Web"
    files:
      - file: "assets/datos.json"
        label: "Datos del sitio"
        name: "datos"
        fields:
          - label: "Datos del negocio"
            name: "negocio"
            widget: "object"
            fields:
              - { label: "Nombre del negocio", name: "nombre", widget: "string" }
              - { label: "WhatsApp 1 (cód. país + área + número, sin 0 ni 15)", name: "telefonoWsp1", widget: "string" }
              - { label: "WhatsApp 2", name: "telefonoWsp2", widget: "string" }
              - { label: "Teléfono para mostrar en pantalla", name: "telefonoTexto", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Instagram (link completo)", name: "instagram", widget: "string" }
              - { label: "Facebook (link completo)", name: "facebook", widget: "string", required: false }
              - { label: "Catálogo en PDF (subir archivo)", name: "catalogoPdf", widget: "file", required: false, hint: "Subí el PDF del catálogo. Aparece como botón de descarga en el sitio." }

          - label: "Carrusel de imágenes (arriba de la página)"
            name: "slides"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Imagen", name: "imagen", widget: "image", hint: "Ideal formato horizontal (banner), pero cualquier tamaño se adapta bien." }
              - { label: "Descripción de la imagen", name: "alt", widget: "string", required: false }
              - { label: "Texto sobre la imagen (opcional)", name: "texto", widget: "string", required: false }

          - label: "Medios de pago"
            name: "mediosDePago"
            widget: "list"
            summary: "{{fields.plan}} — {{fields.detalle}}"
            fields:
              - { label: "Logo (opcional)", name: "imagen", widget: "image", required: false, hint: "Logo de la tarjeta o plan de pago." }
              - { label: "Nombre del plan / tarjeta", name: "plan", widget: "string", required: false }
              - { label: "Detalle (ej: 3 cuotas sin interés)", name: "detalle", widget: "string" }

          - label: "Sucursales"
            name: "sucursales"
            widget: "list"
            summary: "{{fields.nombre}}"
            fields:
              - { label: "Nombre de la sucursal", name: "nombre", widget: "string" }
              - { label: "Dirección", name: "direccion", widget: "string" }
              - { label: "Teléfono", name: "telefono", widget: "string" }
              - { label: "Horario", name: "horario", widget: "string" }

          - label: "Promociones"
            name: "promociones"
            widget: "list"
            summary: "{{fields.producto}}{{fields.categoria}}"
            fields:
              - { label: "Imagen de la promo (opcional — si la subís, se muestra la imagen en vez del texto)", name: "imagen", widget: "image", required: false, hint: "Ideal: el mismo flyer que usás en Instagram." }
              - { label: "Categoría", name: "categoria", widget: "string", required: false }
              - { label: "Producto", name: "producto", widget: "string", required: false }
              - { label: "Precio anterior (dejar 0 si no hay descuento previo)", name: "precioAntes", widget: "number", default: 0, value_type: "int", required: false }
              - { label: "Precio actual", name: "precioAhora", widget: "number", value_type: "int", required: false }
              - { label: "Vigencia (ej: Válido hasta el domingo)", name: "vigencia", widget: "string", required: false }

          - label: "Categorías del catálogo"
            name: "categorias"
            widget: "list"
            summary: "{{fields.nombre}}"
            fields:
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Nombre de la categoría", name: "nombre", widget: "string" }
              - { label: "Descripción corta", name: "desc", widget: "string" }
              - { label: "Link (a catálogo online, si existe)", name: "link", widget: "string", required: false }
